<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sponsor Management - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f766e, #14b8a6);

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;

      background: white;

      border-radius: 20px;

      padding: 35px 28px;

      box-shadow:
        0 15px 40px rgba(0, 0, 0, 0.20);
    }

    .logo {
      width: 75px;
      height: 75px;

      margin: 0 auto 18px;

      border-radius: 50%;

      background: #0f766e;

      color: white;

      display: flex;
      align-items: center;
      justify-content: center;

      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      text-align: center;

      color: #123;

      font-size: 25px;

      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;

      color: #777;

      font-size: 14px;

      margin-bottom: 28px;
    }

    label {
      display: block;

      margin-bottom: 7px;

      color: #333;

      font-size: 14px;

      font-weight: bold;
    }

    input {
      width: 100%;

      padding: 13px 14px;

      border: 1px solid #ddd;

      border-radius: 10px;

      outline: none;

      font-size: 15px;

      margin-bottom: 18px;
    }

    input:focus {
      border-color: #0f766e;

      box-shadow:
        0 0 0 2px rgba(15, 118, 110, 0.10);
    }

    button {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 10px;

      background: #0f766e;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    button:hover {
      background: #0b5f59;
    }

    button:disabled {
      background: #9ca3af;

      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;

      text-align: center;

      font-size: 14px;

      min-height: 20px;

      line-height: 1.5;

      word-break: break-word;
    }

    .redirect-buttons {
      display: none;

      margin-top: 15px;

      gap: 10px;
    }

    .redirect-buttons button {
      background: #2563eb;
    }

    .redirect-buttons button:last-child {
      background: #16a34a;
    }

    .debug {
      display: none;

      margin-top: 15px;

      padding: 10px;

      background: #f3f4f6;

      border-radius: 8px;

      font-size: 12px;

      color: #444;

      word-break: break-word;
    }

    .footer {
      text-align: center;

      margin-top: 25px;

      color: #999;

      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      SP
    </div>

    <h1>
      Sponsor Management
    </h1>

    <p class="subtitle">
      Login to continue
    </p>


    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >


      <button
        type="submit"
        id="loginButton"
      >
        Login
      </button>


      <div
        class="message"
        id="message"
      ></div>


      <div
        class="redirect-buttons"
        id="redirectButtons"
      >

        <button
          type="button"
          id="sponsorButton"
        >
          Open Sponsor Dashboard
        </button>

        <button
          type="button"
          id="adminButton"
        >
          Open Admin Dashboard
        </button>

      </div>


      <div
        class="debug"
        id="debug"
      ></div>

    </form>


    <div class="footer">
      Sponsor Management System
    </div>

  </div>


  <!-- =====================================================
       FIREBASE
       ===================================================== -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    // =====================================================
    // CURRENT FIREBASE CONFIG
    // =====================================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyCQfWt8YCC7c2vbyiUEUHERCFLnvKYf0_Q",

      authDomain:
        "safa-sponsor-management.firebaseapp.com",

      projectId:
        "safa-sponsor-management",

      storageBucket:
        "safa-sponsor-management.firebasestorage.app",

      messagingSenderId:
        "580781673057",

      appId:
        "1:580781673057:web:e8601de35c6e2678f8b820"

    };


    // =====================================================
    // INITIALIZE
    // =====================================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // =====================================================
    // ELEMENTS
    // =====================================================

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const debug =
      document.getElementById("debug");

    const redirectButtons =
      document.getElementById("redirectButtons");

    const sponsorButton =
      document.getElementById("sponsorButton");

    const adminButton =
      document.getElementById("adminButton");


    // =====================================================
    // HELPER
    // =====================================================

    function showMessage(text, color = "#333") {

      message.style.color = color;

      message.textContent = text;

    }


    function showDebug(text) {

      debug.style.display = "block";

      debug.textContent = text;

    }


    function hideRedirectButtons() {

      redirectButtons.style.display = "none";

    }


    function showRedirectButtons() {

      redirectButtons.style.display = "flex";

      redirectButtons.style.flexDirection = "column";

    }


    // =====================================================
    // DIRECT BUTTONS
    // =====================================================

    sponsorButton.addEventListener(
      "click",
      () => {

        window.location.replace(
          "./sponsor.html"
        );

      }
    );


    adminButton.addEventListener(
      "click",
      () => {

        window.location.replace(
          "./dashboard.html"
        );

      }
    );


    // =====================================================
    // LOGIN
    // =====================================================

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        hideRedirectButtons();


        const email =
          document
            .getElementById("email")
            .value
            .trim();


        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          showMessage(
            "Please enter email and password.",
            "#dc2626"
          );

          return;

        }


        loginButton.disabled = true;

        loginButton.textContent =
          "Logging in...";

        showMessage(
          "Please wait...",
          "#0f766e"
        );


        debug.style.display = "none";


        try {

          // =================================================
          // FIREBASE AUTH LOGIN
          // =================================================

          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          console.log(
            "LOGIN SUCCESS"
          );

          console.log(
            "UID:",
            user.uid
          );

          console.log(
            "EMAIL:",
            user.email
          );


          // =================================================
          // GET USERS DOCUMENT
          // =================================================

          showMessage(
            "Login successful. Checking account...",
            "#0f766e"
          );


          const userRef =
            doc(
              db,
              "users",
              user.uid
            );


          const userSnapshot =
            await getDoc(userRef);


          // =================================================
          // DOCUMENT NOT FOUND
          // =================================================

          if (!userSnapshot.exists()) {

            await signOut(auth);


            showMessage(
              "User profile not found.",
              "#dc2626"
            );


            showDebug(
              "Firebase Auth login succeeded, but Firestore document users/" +
              user.uid +
              " was not found."
            );


            loginButton.disabled = false;

            loginButton.textContent =
              "Login";

            return;

          }


          // =================================================
          // USER DATA
          // =================================================

          const userData =
            userSnapshot.data();


          const role =
            userData.role;


          const sponsorId =
            userData.sponsorId || "";


          console.log(
            "USER DATA:",
            userData
          );

          console.log(
            "ROLE:",
            role
          );

          console.log(
            "SPONSOR ID:",
            sponsorId
          );


          // =================================================
          // ADMIN
          // =================================================

          if (role === "admin") {

            showMessage(
              "Admin login successful.",
              "#0f766e"
            );


            showDebug(
              "Role detected: ADMIN"
            );


            /*
              Direct redirect.
              No setTimeout.
            */

            window.location.replace(
              "./dashboard.html"
            );


            return;

          }


          // =================================================
          // SPONSOR
          // =================================================

          if (role === "sponsor") {

            showMessage(
              "Sponsor login successful.",
              "#0f766e"
            );


            showDebug(
              "Role detected: SPONSOR" +
              (sponsorId
                ? " | Sponsor ID: " + sponsorId
                : "")
            );


            /*
              Direct redirect.
              No setTimeout.
            */

            window.location.replace(
              "./sponsor.html"
            );


            return;

          }


          // =================================================
          // INVALID ROLE
          // =================================================

          await signOut(auth);


          showMessage(
            "Invalid user role.",
            "#dc2626"
          );


          showDebug(
            "The users document exists, but the role is: " +
            String(role)
          );


          loginButton.disabled = false;

          loginButton.textContent =
            "Login";

        }


        catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );


          console.error(
            "ERROR CODE:",
            error.code
          );


          console.error(
            "ERROR MESSAGE:",
            error.message
          );


          // =================================================
          // AUTH ERRORS
          // =================================================

          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            showMessage(
              "Invalid email or password.",
              "#dc2626"
            );

          }


          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            showMessage(
              "Please enter a valid email.",
              "#dc2626"
            );

          }


          else if (
            error.code ===
            "auth/user-disabled"
          ) {

            showMessage(
              "This account has been disabled.",
              "#dc2626"
            );

          }


          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            showMessage(
              "Too many attempts. Please try again later.",
              "#dc2626"
            );

          }


          // =================================================
          // FIRESTORE PERMISSION
          // =================================================

          else if (
            error.code ===
            "permission-denied"
          ) {

            showMessage(
              "Firestore permission denied.",
              "#dc2626"
            );


            showDebug(
              "Firebase Auth login worked, but Firestore denied access to users/" +
              (auth.currentUser
                ? auth.currentUser.uid
                : "")
            );

          }


          // =================================================
          // OTHER ERROR
          // =================================================

          else {

            showMessage(
              error.message ||
              "Login failed. Please try again.",
              "#dc2626"
            );


            showDebug(
              "Error code: " +
              (error.code || "unknown") +
              " | " +
              "Error: " +
              (error.message || "unknown error")
            );

          }

        }


        loginButton.disabled = false;

        loginButton.textContent =
          "Login";

      }
    );

  </script>

</body>
</html>
