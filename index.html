<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sponsor Management - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f766e, #14b8a6);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      border-radius: 20px;
      padding: 35px 28px;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.20);
    }

    .logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: #0f766e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: bold;
    }

    h1 {
      text-align: center;
      color: #123;
      font-size: 25px;
      margin-bottom: 7px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 14px;
      margin-bottom: 28px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #333;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      outline: none;
      font-size: 15px;
      margin-bottom: 18px;
    }

    input:focus {
      border-color: #0f766e;
      box-shadow: 0 0 0 2px rgba(15, 118, 110, 0.10);
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #0f766e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #0b5f59;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      text-align: center;
      font-size: 14px;
      min-height: 20px;
      line-height: 1.5;
      word-break: break-word;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #999;
      font-size: 12px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="logo">
      SP
    </div>

    <h1>
      Sponsor Management
    </h1>

    <p class="subtitle">
      Login to continue
    </p>

    <form id="loginForm">

      <label for="email">
        Email
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        autocomplete="email"
        required
      >

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        autocomplete="current-password"
        required
      >

      <button
        type="submit"
        id="loginButton"
      >
        Login
      </button>

      <div
        class="message"
        id="message"
      ></div>

    </form>

    <div class="footer">
      Sponsor Management System
    </div>

  </div>


  <!-- FIREBASE -->

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      signInWithEmailAndPassword,
      signOut
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    import {
      getFirestore,
      doc,
      getDoc
    }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";


    // ==========================================
    // FIREBASE CONFIG
    // SAFA SPONSOR MANAGEMENT
    // ==========================================

    const firebaseConfig = {

      apiKey:
        "AIzaSyCQfWt8YCC7c2vbyiUEUHERCFLnvKYf0_Q",

      authDomain:
        "safa-sponsor-management.firebaseapp.com",

      projectId:
        "safa-sponsor-management",

      storageBucket:
        "safa-sponsor-management.firebasestorage.app",

      messagingSenderId:
        "580781673057",

      appId:
        "1:580781673057:web:e8601de35c6e2678f8b820"

    };


    // ==========================================
    // INITIALIZE FIREBASE
    // ==========================================

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);

    const db =
      getFirestore(app);


    // ==========================================
    // ELEMENTS
    // ==========================================

    const loginForm =
      document.getElementById("loginForm");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");


    // ==========================================
    // SHOW MESSAGE
    // ==========================================

    function showMessage(text, color) {

      message.textContent = text;
      message.style.color = color;

    }


    // ==========================================
    // LOGIN
    // ==========================================

    loginForm.addEventListener(
      "submit",
      async (event) => {

        event.preventDefault();


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          showMessage(
            "Please enter email and password.",
            "#dc2626"
          );

          return;
        }


        loginButton.disabled = true;
        loginButton.textContent = "Logging in...";

        showMessage("", "#333");


        try {

          // ==========================================
          // FIREBASE AUTH LOGIN
          // ==========================================

          const userCredential =
            await signInWithEmailAndPassword(
              auth,
              email,
              password
            );


          const user =
            userCredential.user;


          console.log(
            "LOGIN SUCCESS"
          );

          console.log(
            "Logged in UID:",
            user.uid
          );


          // ==========================================
          // GET USERS DOCUMENT
          // ==========================================

          const userRef =
            doc(
              db,
              "users",
              user.uid
            );


          console.log(
            "Checking Firestore document:",
            "users/" + user.uid
          );


          const userSnapshot =
            await getDoc(userRef);


          // ==========================================
          // USER DOCUMENT DOES NOT EXIST
          // ==========================================

          if (!userSnapshot.exists()) {

            await signOut(auth);

            throw new Error(
              "Login successful, but users/" +
              user.uid +
              " document was not found in Firestore."
            );
          }


          // ==========================================
          // GET USER DATA
          // ==========================================

          const userData =
            userSnapshot.data();


          console.log(
            "User data:",
            userData
          );


          const role =
            userData.role;


          console.log(
            "User role:",
            role
          );


          // ==========================================
          // ADMIN
          // ==========================================

          if (role === "admin") {

            showMessage(
              "Login successful. Opening dashboard...",
              "#0f766e"
            );

            console.log(
              "ADMIN FOUND"
            );

            console.log(
              "Opening dashboard.html"
            );


            window.location.assign(
              "./dashboard.html"
            );


            return;
          }


          // ==========================================
          // SPONSOR
          // ==========================================

          if (role === "sponsor") {

            showMessage(
              "Login successful. Opening sponsor page...",
              "#0f766e"
            );

            console.log(
              "SPONSOR FOUND"
            );

            console.log(
              "Opening sponsor.html"
            );


            window.location.assign(
              "./sponsor.html"
            );


            return;
          }


          // ==========================================
          // INVALID ROLE
          // ==========================================

          await signOut(auth);

          throw new Error(
            "Invalid role: " +
            role +
            ". Please set role to admin or sponsor."
          );

        }


        catch (error) {

          console.error(
            "LOGIN ERROR:",
            error
          );


          let errorMessage =
            "Login failed.";


          // ==========================================
          // AUTH ERRORS
          // ==========================================

          if (
            error.code ===
            "auth/invalid-credential"
          ) {

            errorMessage =
              "Invalid email or password.";

          }

          else if (
            error.code ===
            "auth/invalid-email"
          ) {

            errorMessage =
              "Please enter a valid email.";

          }

          else if (
            error.code ===
            "auth/user-disabled"
          ) {

            errorMessage =
              "This account has been disabled.";

          }

          else if (
            error.code ===
            "auth/too-many-requests"
          ) {

            errorMessage =
              "Too many login attempts. Please try again later.";

          }

          else if (
            error.code ===
            "permission-denied"
          ) {

            errorMessage =
              "Firestore permission denied. Please check Firestore Rules.";

          }

          else if (
            error.message
          ) {

            errorMessage =
              error.message;

          }


          showMessage(
            errorMessage,
            "#dc2626"
          );


          loginButton.disabled = false;
          loginButton.textContent = "Login";

        }

      }
    );

  </script>

</body>
</html>
